<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Student Performance Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="text-center mb-4">University Student Performance Dashboard</h1>
        <div id="studentList" class="row g-4"></div>

        <div class="card shadow mt-5">
            <div class="card-body">
                <h3>Student Object Information</h3>
                <div id="objectInfo"></div>
            </div>
        </div>

        <div class="card shadow mt-4">
            <div class="card-body">
                <h3>Final Dashboard Statistics</h3>
                <p>Total Students: <span id="totalStudents"></span></p>
                <p>Passed Students: <span id="passedStudents"></span></p>
                <p>Failed Students: <span id="failedStudents"></span></p>
            </div>
        </div>
    </div>

    <script>
        class Student {
            constructor(name, rollNumber, department, semester, cgpa, marks) {
                this.name = name;
                this.rollNumber = rollNumber;
                this.department = department;
                this.semester = semester;
                this.cgpa = cgpa;
                this.marks = marks;
            }
        }

        const students = [
            new Student("Shahreyar Ahmad", "BSCS-242713", "Computer Science", 6, 3.45, 82),
            new Student("Ahmed", "BSCS-002", "Computer Science", 5, 2.80, 67),
            new Student("Sara", "BSIT-003", "Information Technology", 4, 3.20, 75),
            new Student("Ayesha", "BSSE-004", "Software Engineering", 3, 2.65, 58),
            new Student("Hassan", "BSEE-005", "Electrical Engineering", 7, 1.85, 45),
            new Student("Usman", "BSCS-006", "Computer Science", 6, 3.05, 88)
        ];

        const departments = ["Computer Science", "Information Technology"];
        departments.push("Software Engineering");
        const hasComputerScience = departments.includes("Computer Science");

        function calculateGrade(marks) {
            if (marks >= 80) {
                return "A";
            } else if (marks >= 70) {
                return "B";
            } else if (marks >= 60) {
                return "C";
            } else if (marks >= 50) {
                return "D";
            } else {
                return "F";
            }
        }

        const getStatus = cgpa => cgpa >= 2.0 ? "Eligible" : "Academic Warning";

        const studentList = document.getElementById("studentList");

        students.forEach(student => {
            const { name, rollNumber, department, semester, cgpa, marks } = student;
            const grade = calculateGrade(marks);
            const status = getStatus(cgpa);

            studentList.innerHTML += `
                <div class="col-md-6 col-lg-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-body">
                            <h4>${name}</h4>
                            <p>Roll No: ${rollNumber}</p>
                            <p>Department: ${department}</p>
                            <p>Semester: ${semester}</p>
                            <p>CGPA: ${cgpa}</p>
                            <p>Marks: ${marks}</p>
                            <p>Grade: <strong>${grade}</strong></p>
                            <p>Status: <strong>${status}</strong></p>
                        </div>
                    </div>
                </div>
            `;
        });

        let passedStudents = 0;

        for (let i = 0; i < students.length; i++) {
            if (students[i].marks >= 50) {
                passedStudents++;
            }
        }

        for (const student of students) {
            console.log(student.name);
        }

        const objectInfo = document.getElementById("objectInfo");

        for (const property in students[0]) {
            objectInfo.innerHTML += `<p><strong>${property}:</strong> ${students[0][property]}</p>`;
        }

        document.getElementById("totalStudents").textContent = students.length;
        document.getElementById("passedStudents").textContent = passedStudents;
        document.getElementById("failedStudents").textContent = students.length - passedStudents;
    </script>
</body>
</html>
