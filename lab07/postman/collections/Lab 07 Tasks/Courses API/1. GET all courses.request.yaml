$kind: http-request
url: "{{baseUrl}}/api/courses"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', () => pm.response.to.have.status(200));
      pm.test('Returns a course list', () => pm.expect(pm.response.json()).to.be.an('array').that.is.not.empty);
    language: text/javascript
order: 1000
