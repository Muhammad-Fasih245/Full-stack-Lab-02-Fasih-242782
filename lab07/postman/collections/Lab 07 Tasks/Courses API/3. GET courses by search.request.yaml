$kind: http-request
url: "{{baseUrl}}/api/courses?search=machine"
method: GET
queryParams:
  search: machine
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', () => pm.response.to.have.status(200));
      pm.test('Search finds Machine Learning', () => pm.expect(pm.response.json().some(c => c.title === 'Machine Learning')).to.be.true);
    language: text/javascript
order: 3000
