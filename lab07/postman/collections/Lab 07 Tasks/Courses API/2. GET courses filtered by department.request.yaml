$kind: http-request
url: "{{baseUrl}}/api/courses?department=Data%20Science"
method: GET
queryParams:
  department: Data%20Science
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', () => pm.response.to.have.status(200));
      pm.test('Every result is Data Science', () => pm.expect(pm.response.json().every(c => c.department === 'Data Science')).to.be.true);
    language: text/javascript
order: 2000
